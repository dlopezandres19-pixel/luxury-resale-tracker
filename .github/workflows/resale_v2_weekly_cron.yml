name: Resale V2 — Weekly Scrape (cron-driven, no webhook)

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scrape Rebag — US (8 models, one call each)
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python scraper/run_rebag.py
        continue-on-error: true

#      - name: Scrape Vestiaire — EU (8 models, one call each)
#        env:
#          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
#        run: python scraper/run_vestiaire_per_model.py --region EU
#        continue-on-error: true

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data_v2/
          git diff --staged --quiet || git commit -m "chore: resale v2 weekly scrape $(date -u +%Y-%m-%d)"
          git push
