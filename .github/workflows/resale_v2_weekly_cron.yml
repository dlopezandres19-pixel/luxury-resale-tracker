name: Resale V2 — Weekly Scrape (cron-driven, no webhook)

# US: Rebag (Clair Codes para LV, title filters para Hermès)
# EU: Vestiaire Collective (one call per model, maxItems=20, timeout=1800s)
# China Resale: Xianyu (SKUs M46987/M46977 para LV, keywords chinos para Hermès)
# China Social: Douyin (5 marcas, engagement score semanal)

on:
  schedule:
    - cron: '0 8 * * 1'   # Every Monday 08:00 UTC = 3:00 AM Lima (UTC-5)
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scrape Rebag — US (6 models, one call each)
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python scraper/run_rebag.py

      - name: Scrape Vestiaire — EU (6 models, one call each)
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python scraper/run_vestiaire_per_model.py --region EU

      - name: Scrape Xianyu — China Resale (1 call, 6 keywords)
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python scraper/run_xianyu.py

      - name: Scrape Douyin — China Social (5 brands, weekly engagement)
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python scraper/run_douyin.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data_v2/
          git diff --staged --quiet || git commit -m "chore: resale v2 weekly scrape $(date -u +%Y-%m-%d)"
          git push
